D.types.forEach(t=>{const d=(D.o2[t]-D.o1[t]).toFixed(1);h+=`<tr><td class=l><span class="sw" style="background:${COL[t]}"></span>${t}</td><td>${D.o1[t]}%</td><td><b>${D.o2[t]}%</b></td><td class="up">+${d}</td></tr>`;});
document.getElementById('ov').innerHTML=h;
let g='<tr><th class=l>policy</th>'+D.fams.map(f=>`<th>${f.split(' ')[0]}</th>`).join('')+'</tr>';
D.types.forEach((t,ti)=>{g+=`<tr><td class=l><span class="sw" style="background:${COL[t]}"></span>${t}</td>`+D.cellrows[ti].map(c=>`<td>${c.s100}→<b>${c.s200}</b></td>`).join('')+'</tr>';});
document.getElementById('tbl').innerHTML=g;
</script>
